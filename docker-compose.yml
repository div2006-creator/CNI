version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intel_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - USE_MOCK_GRAPH=True
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intel_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

  postgres:
    image: postgres:15-alpine
    container_name: intel_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: intel_network_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    container_name: intel_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
    ports:
      - "7474:7474" # HTTP Web Console
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
